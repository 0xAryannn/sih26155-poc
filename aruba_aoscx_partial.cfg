! Aruba AOS-CX Switch Configuration
! Platform: Aruba 6300M (AOS-CX 10.x)
! Generated for configuration audit / parser testing
!
hostname ARUBA-CORE-SW01
!
no ip icmp redirect
!
vlan 1
vlan 10
    name "MGMT"
vlan 20
    name "USERS"
vlan 99
    name "NATIVE"
!
! --- Local user accounts ---
! NOTE: AOS-CX stores local user passwords as SHA-512 hashes by default;
! this line reflects the "show running-config" output style.
user admin group administrators password ciphertext AQBapt3RSNKA2xQ...redacted...==
!
! --- Management access: SSH ---
ssh server vrf mgmt
ssh server vrf default
!
! --- Management access: Telnet (disabled by default on AOS-CX; shown explicitly here) ---
no telnet-server
! To enable (not recommended), the command would be:
!   telnet-server
!
! --- HTTPS/HTTP management interface ---
https-server vrf mgmt
https-server vrf default
! HTTP (unencrypted) server is disabled by default on AOS-CX.
! It cannot be independently re-enabled in modern firmware; only https-server exists.
!
! --- SNMP ---
snmp-server community "public" access-level ro
snmp-server system-contact "netops@example.com"
snmp-server system-location "DC1-Rack12"
snmp-server vrf default
!
! --- Password/secret handling ---
! AOS-CX encrypts all locally stored secrets (local users, SNMPv3 auth/priv keys,
! RADIUS/TACACS shared secrets) automatically; there is no equivalent of Cisco's
! "service password-encryption" toggle because plaintext storage is not an option.
!
! --- TACACS/RADIUS (optional, shown for completeness) ---
! tacacs-server host 10.0.0.5 key plaintext CHANGE_ME
!
! --- Interface examples ---
interface 1/1/1
    no shutdown
    vlan access 10
    description "Uplink-to-Core"
!
interface 1/1/2
    no shutdown
    vlan access 20
!
interface mgmt
    no shutdown
    ip static 10.0.99.5/24
    default-gateway 10.0.99.1
!
! --- Banner ---
banner motd ^
Authorized access only. All activity is logged.
^
!
! --- NTP ---
ntp server 10.0.0.1
ntp enable
!
end
