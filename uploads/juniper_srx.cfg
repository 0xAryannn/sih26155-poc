set system host-name JUNIPER-FW01
set system time-zone UTC
set system authentication-order radius
set system authentication-order password
set system login message "Authorized access only. All activity is monitored."
set system login announcement "Maintenance window: Sundays 02:00-04:00 UTC"
set system login retry-options tries-before-disconnect 3
set system login retry-options lockout-period 15
set system login idle-timeout 10
set system login password minimum-length 15
set system login password minimum-upper-cases 1
set system login password minimum-lower-cases 1
set system login password minimum-numerics 1
set system login password minimum-punctuations 1
set system login password minimum-changes 4
set system login class ADMIN permissions all
set system login class ADMIN idle-timeout 5
set system login user admin class super-user
set system login user admin authentication encrypted-password "$6$randomhash..."
set system radius-server 10.0.0.5 secret "$9$encrypted..."
set system radius-server 10.0.0.5 source-address 192.168.1.1
set system services ssh protocol-version v2
set system services ssh connection-limit 3
set system services ssh max-sessions-per-connection 3
set system services ssh macs hmac-sha2-256
set system services ssh ciphers aes256-cbc
set system services ssh key-exchange group14
set system services ssh root-login deny
set system services ssh hostkey-algorithm ssh-rsa
set system services netconf ssh
set system syslog host 10.0.0.10 any info
set system syslog host 10.0.0.11 any info
set system syslog file messages any notice
set system syslog file messages authorization info
set system syslog file messages change-log info
set system syslog file messages interactive-commands info
set system syslog file messages archive size 1000000
set system syslog file messages archive files 12
set system syslog time-format year millisecond
set system ntp server 10.0.0.1 prefer
set system ntp server 10.0.0.2
set system ntp authentication-key 1 type md5 value "$9$encrypted"
set system ntp trusted-key [1 2]
set system archival configuration transfer-on-commit archive-sites "scp://backup@10.0.0.20/configs"
set interfaces ge-0/0/0 unit 0 family inet address 192.168.1.1/24
set interfaces ge-0/0/1 unit 0 family inet address 10.0.1.1/24
set interfaces ge-0/0/2 disable
set interfaces lo0 unit 0 family inet address 10.255.0.1/32
set interfaces lo0 unit 0 family inet filter input RESTRICT_MGMT_ACCESS
set firewall family inet filter RESTRICT_MGMT_ACCESS term ALLOW_SSH from source-address 192.168.0.0/16
set firewall family inet filter RESTRICT_MGMT_ACCESS term ALLOW_SSH from protocol tcp
set firewall family inet filter RESTRICT_MGMT_ACCESS term ALLOW_SSH from destination-port ssh
set firewall family inet filter RESTRICT_MGMT_ACCESS term ALLOW_SSH then accept
set firewall family inet filter RESTRICT_MGMT_ACCESS term DENY_ALL then reject
set snmp v3 usm local-engine user snmpuser authentication-sha authentication-password "securepass"
set snmp v3 usm local-engine user snmpuser privacy-aes128 privacy-password "privpass"
set snmp v3 target-parameters tp1 parameters security-level privacy
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0 authentication md5 1 key "$9$encrypted"
set protocols bgp group EBGP-PEERS peer-as 65001
set protocols bgp group EBGP-PEERS authentication-key "$9$encrypted"
set security screen ids-option untrust-screen tcp syn-flood alarm-threshold 1024
set security screen ids-option untrust-screen tcp syn-flood attack-threshold 200
set security screen ids-option untrust-screen tcp syn-flood source-threshold 1024
set security pki ca-profile CA-PROFILE ca-identity "Enterprise-CA"
set routing-options static route 0.0.0.0/0 next-hop 192.168.1.254
set routing-options autonomous-system 65000
set policy-options prefix-list MGMT-HOSTS 192.168.0.0/16
set vlans MGMT vlan-id 10
set vlans USERS vlan-id 20
