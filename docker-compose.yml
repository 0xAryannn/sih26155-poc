services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: netaudit-backend
    ports:
      - "5001:5001"
    volumes:
      - ./uploads:/app/uploads
      - ./benchmark_audit/results:/app/benchmark_audit/results
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: netaudit-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
